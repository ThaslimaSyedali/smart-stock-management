<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add or Restock Product - Smart Stock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffb7ba;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fffaf7;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #888888;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #252423;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        ul {
            margin-top: 15px;
            padding-left: 20px;
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add or Restock Product</h1>
        <form method="post">
            <label for="name">Name:</label>
            <input name="name" required>

            <label for="quantity">Quantity:</label>
            <input name="quantity" type="number" required>

            <label for="price">Price:</label>
            <input name="price" type="number" step="0.01" required>

            <label for="reorder_level">Reorder Level:</label>
            <input name="reorder_level" type="number" value="5">

            <label for="expiry_date">Expiry Date:</label>
            <input name="expiry_date" type="date">

            <button type="submit">Add Product</button>
        </form>

        <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
        {% endwith %}
    </div>
</body>
</html>
