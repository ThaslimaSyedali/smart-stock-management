<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales History - Smart Stock</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #ecf0f1;
            color: #34495e;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .footer-note {
            text-align: center;
            font-size: 0.9em;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sales History</h1>
        <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
        <table>
            <tr>
                <th>Product</th>
                <th>Quantity Sold</th>
                <th>Date</th>
            </tr>
            {% for sale in sales %}
            <tr>
                <td>{{ sale['name'] }}</td>
                <td>{{ sale['quantity'] }}</td>
                <td>{{ sale['date'] }}</td>
            </tr>
            {% endfor %}
        </table>
        <div class="footer-note">
            Smart Stock &copy; 2025
        </div>
    </div>
</body>
</html>
